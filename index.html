<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AVROK ACS</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;background:#eef1f5}
.shell-header{background:linear-gradient(135deg,#1a3e8c,#14213d);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:12px;padding-top:max(14px,env(safe-area-inset-top,14px));display:none}
.shell-logo{width:44px;height:44px;border-radius:10px;background:#fff;padding:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.shell-logo img{width:100%;height:100%;object-fit:contain}
.shell-brand{font-size:18px;font-weight:800;letter-spacing:.3px}
.shell-tagline{font-size:11px;color:#c9d6f0;margin-top:1px}
.tab-row{display:none;gap:8px;padding:10px 12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);position:sticky;top:0;z-index:50}
.tab-btn{flex:1;border:none;border-radius:8px;padding:11px 8px;font-size:13.5px;font-weight:800;cursor:pointer;color:#fff;opacity:.55;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab-btn.active{opacity:1}
#tabBill{background:linear-gradient(90deg,#1a3e8c,#14213d)}
#tabQuote{background:linear-gradient(90deg,#9c1f6e,#7a1656)}
.app-frame-wrap{position:relative;height:100vh;height:100dvh}
.authenticated-shell .shell-header{display:flex}
.authenticated-shell .tab-row{display:flex}
.authenticated-shell .app-frame-wrap{height:calc(100vh - 116px);height:calc(100dvh - 116px)}
.app-frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:#eef1f5}
#chatFab{display:none !important;position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom,16px));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer;z-index:200;border:none}
#chatWindow{position:fixed;right:12px;left:12px;bottom:max(84px,calc(env(safe-area-inset-bottom,0px) + 84px));max-width:400px;margin:0 auto;height:min(60vh,480px);background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.3);display:none;flex-direction:column;overflow:hidden;z-index:200}
#chatWindow.show{display:flex}
.chat-head{background:linear-gradient(90deg,#25D366,#128C7E);color:#fff;padding:12px 14px;font-weight:800;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.chat-head button{background:rgba(255,255,255,.2);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px}
#chatMessages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f4f6f9}
.chat-msg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.chat-msg.user{align-self:flex-end;background:#1a3e8c;color:#fff;border-bottom-right-radius:3px}
.chat-msg.bot{align-self:flex-start;background:#fff;color:#222;border:1px solid #e3e7ee;border-bottom-left-radius:3px}
.chat-msg.bot.pending{color:#888;font-style:italic}
.chat-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid #eee;background:#fff}
.chat-input-row input{flex:1;border:1px solid #ccc;border-radius:20px;padding:9px 14px;font-size:13.5px}
.authenticated-shell #chatFab{display:none !important}
.chat-input-row button{background:#25D366;color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:15px;cursor:pointer;flex-shrink:0}
</style>
</head>

function decodeEmbedded(b64){
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
document.getElementById('billFrame').srcdoc=decodeEmbedded(BILL_DATA);
document.getElementById('quoteFrame').srcdoc=decodeEmbedded(QUOTE_DATA);

function setAuthenticatedShell(isAuthenticated){
  document.body.classList.toggle('authenticated-shell', !!isAuthenticated);
  if(!isAuthenticated){
    document.getElementById('chatWindow').classList.remove('show');
  }
}
window.addEventListener('message', function(event){
  const data = event && event.data;
  if(data && data.type === 'avrok-auth-state'){
    setAuthenticatedShell(!!data.authenticated);
  }
});

function showApp(which){
  const billBtn=document.getElementById('tabBill'), quoteBtn=document.getElementById('tabQuote');
  const billFrame=document.getElementById('billFrame'), quoteFrame=document.getElementById('quoteFrame');
  const isBill=which==='bill';
  billFrame.style.display=isBill?'block':'none';
  quoteFrame.style.display=isBill?'none':'block';
  billBtn.classList.toggle('active',isBill);
  quoteBtn.classList.toggle('active',!isBill);
}

let chatHistory=[];
function toggleChat(){document.getElementById('chatWindow').classList.toggle('show')}
function appendChatMsg(text,who){
  const box=document.getElementById('chatMessages'), div=document.createElement('div');
  div.className='chat-msg '+who; div.textContent=text; box.appendChild(div); box.scrollTop=box.scrollHeight; return div;
}
async function sendChatMessage(){
  const input=document.getElementById('chatInput'), msg=input.value.trim();
  if(!msg)return; input.value=''; appendChatMsg(msg,'user'); chatHistory.push({role:'user',content:msg});
  const pending=appendChatMsg('Typing...','bot pending');
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chatHistory})});
    if(!res.ok)throw new Error('Server error: '+res.status);
    const data=await res.json(), reply=data.reply||'Sorry, no response.';
    pending.textContent=reply; pending.classList.remove('pending'); chatHistory.push({role:'assistant',content:reply});
  }catch(err){
    pending.textContent='AI chat ke liye /api/chat backend required hai.';
    pending.classList.remove('pending');
  }
}
</script>
